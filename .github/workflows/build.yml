name: Build PreBoard Buddy APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack Android project
        run: unzip -o PreBoardBuddyAndroid_Source.zip -d .
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p PreBoardBuddyAndroid :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PreBoardBuddy-APK
          path: PreBoardBuddyAndroid/app/build/outputs/apk/debug/app-debug.apk
